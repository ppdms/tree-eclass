name: tree-eclass

# Optional future Linux host. ./tree never starts this stack on the laptop.
# Prepare private configuration first; migration is an explicit stopped operation.
x-api: &api
  build: .
  image: tree-eclass-local:${TREE_RELEASE:?set a committed release identifier}
  environment:
    TREE_RUNTIME_CONFIG: /run/secrets/application.json
    GOMEMLIMIT: 192MiB
  volumes:
    - jobs:/jobs
  secrets:
    - source: application
      target: application.json
  networks: [storage, app]
  stop_grace_period: 90s
  restart: 'no'

services:
  postgres:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_USER: tree
      POSTGRES_DB: tree
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      PGDATA: /var/lib/postgresql/18/docker
    command:
      [
        postgres,
        -c,
        shared_buffers=32MB,
        -c,
        work_mem=2MB,
        -c,
        maintenance_work_mem=32MB,
        -c,
        max_connections=16,
        -c,
        max_parallel_workers=0,
      ]
    volumes:
      - postgres:/var/lib/postgresql
    secrets: [postgres-password]
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tree -d tree]
      interval: 2s
      retries: 30
    stop_grace_period: 90s
    restart: 'no'

  seaweed:
    image: docker.io/chrislusf/seaweedfs:4.46
    command:
      - mini
      - -dir=/data
      - -ip=seaweed
      - -ip.bind=0.0.0.0
      - -master.telemetry=false
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.iam=false
      - -s3.config=/run/secrets/s3.json
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.cacheCapacityMB=0
      - -master.volumeSizeLimitMB=128
      - -volume.max=64
      - -volume.index=leveldb
      - -volume.readBufferSizeMB=1
      - -filer.concurrentFileUploadLimit=1
      - -s3.concurrentFileUploadLimit=1
      - -s3.concurrentUploadLimitMB=64
      - -volume.concurrentUploadLimitMB=64
      - -volume.concurrentDownloadLimitMB=64
      - -filer.disableDirListing=true
      - -filer.exposeDirectoryData=false
    environment:
      GOMEMLIMIT: 192MiB
    volumes:
      - objects:/data
    secrets:
      - source: s3
        target: s3.json
    networks: [storage]
    stop_grace_period: 90s
    restart: 'no'

  migrate:
    <<: *api
    profiles: [maintenance]
    command: [container-migrate]
    depends_on:
      postgres: { condition: service_healthy }
      seaweed: { condition: service_started }

  api:
    <<: *api
    command: [container-serve]
    ports: [127.0.0.1:8000:8001]
    depends_on:
      postgres: { condition: service_healthy }
      seaweed: { condition: service_started }

volumes:
  postgres:
  objects:
  jobs:

networks:
  storage:
    internal: true
  app:

secrets:
  application:
    file: ${TREE_CONTAINER_CONFIG:?path to private application configuration}
  s3:
    file: ${TREE_S3_CONFIG:?path to private SeaweedFS identity configuration}
  postgres-password:
    file: ${TREE_POSTGRES_PASSWORD_FILE:?path to private PostgreSQL password file}
