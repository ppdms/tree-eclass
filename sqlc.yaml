version: '2'
sql:
  - engine: postgresql
    schema: backend/internal/infrastructure/storage/migrations
    queries: backend/internal/domain/queries
    gen:
      go:
        package: queries
        out: backend/internal/domain/queries
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
